; ============================================================
;  セリフ一覧作成ツールの設定ファイル
;  メモ帳で開いて「=」の右側を書きかえ、上書き保存してください。
;  「;」で始まる行は説明文です（ツールは読みません）。
;  はい／いいえ の項目は「はい」か「いいえ」を書いてください。
; ============================================================

[設定]

; 台本の形式。今は「4コマ」だけに対応しています。
台本の形式 = 4コマ

; 1本あたりのコマ数。これと違う本があると警告します。
; 0 にするとコマ数のチェックをしません。
1本あたりのコマ数 = 4

; 台詞1つあたりの文字数の上限。これより長い台詞があると警告します。
; （文字数には空白を数えません。「……」は2文字と数えます）
文字数の上限 = 30

; 効果音も文字数チェックの対象にするか
効果音も文字数チェックする = いいえ

; テキストファイルに効果音を含めるか
テキストに効果音を含める = いいえ

; テキストファイルの各台詞の前に「結衣（心）：」のような話者名を付けるか
; 写植ソフトにそのまま貼るなら「いいえ」がおすすめです。
テキストに話者名を付ける = いいえ

; テキストファイルに、台詞のないコマも「（台詞なし）」として書くか
テキストに台詞なしのコマも書く = いいえ


[種類の略号]
; 話者名のうしろの（ ）に書く略号と、一覧に表示する種類の名前の対応です。
; 新しい略号を使いたいときは、ここに1行追加してください。
; ここにない略号は、そのままの文字が種類になります（例：（電話）→ 電話）。
心 = 心の声
モ = モノローグ
寝言 = 寝言


[効果音の話者名]
; ここに書いた名前の話者は「効果音」として扱います。「、」で区切って複数書けます。
名前 = SE、効果音
